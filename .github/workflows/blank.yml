
name: Benja Cloud PC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-pc:
    name: Preparar Windows Cloud
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Preparar ambiente
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "       BENJA CLOUD PC"
          Write-Host "================================"

          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor
          $os = Get-CimInstance Win32_OperatingSystem

          Write-Host "Computador: $($computer.Name)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Nucleos: $($cpu.NumberOfCores)"
          Write-Host "RAM: $([math]::Round($computer.TotalPhysicalMemory / 1GB, 2)) GB"
          Write-Host "Windows: $($os.Caption)"
          Write-Host "Versao: $($os.Version)"

      - name: Verificar ferramentas
        shell: pwsh
        run: |
          Write-Host "Verificando ferramentas..."

          $tools = @("git", "7z", "pwsh")

          foreach ($tool in $tools) {
            $found = Get-Command $tool -ErrorAction SilentlyContinue

            if ($found) {
              Write-Host "$tool encontrado."
            } else {
              Write-Host "$tool nao encontrado."
            }
          }

      - name: Verificar CPU e memoria
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
            NumberOfLogicalProcessors

          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize,
            FreePhysicalMemory

      - name: Verificar disco
        shell: pwsh
        run: |
          Get-Volume |
            Select-Object DriveLetter,
            FileSystemLabel,
            Size,
            SizeRemaining

      - name: Diagnostico de rede
        shell: pwsh
        run: |
          Get-NetAdapter |
            Select-Object Name, Status, LinkSpeed

      - name: Finalizar diagnostico
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "      BENJA CLOUD PC"
          Write-Host "================================"
          Write-Host "Diagnostico concluido."
          
