
name: Maquina Virtual

on:
  workflow_dispatch:

jobs:
  windows:
    name: Preparar Windows
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configurar RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Criar usuario Benja
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $password = "Bnj@11223333"
          $secure = ConvertTo-SecureString $password -AsPlainText -Force

          $user = Get-LocalUser -Name "Benja" `
            -ErrorAction SilentlyContinue

          if ($user) {
            Set-LocalUser -Name "Benja" -Password $secure
          } else {
            New-LocalUser `
              -Name "Benja" `
              -Password $secure `
              -Description "Usuario de acesso remoto" `
              -AccountNeverExpires
          }

          Enable-LocalUser -Name "Benja"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "Benja" `
            -ErrorAction SilentlyContinue

          Write-Host "Usuario configurado."

      - name: Verificar Windows
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, OSArchitecture

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores

          Get-PSDrive C |
            Select-Object Used, Free

      - name: Finalizar
        shell: pwsh
        run: |
          Write-Host "Preparacao concluida."
          Write-Host "Usuario: Benja"
          Write-Host "Este runner e temporario."
          
