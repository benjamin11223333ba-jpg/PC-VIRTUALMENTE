
name: Benja Cloud PC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-pc:
    name: Preparar Windows Cloud
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Preparar ambiente
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "       BENJA CLOUD PC"
          Write-Host "================================"

          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor
          $os = Get-CimInstance Win32_OperatingSystem

          Write-Host "Computador: $($computer.Name)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Nucleos: $($cpu.NumberOfCores)"
          Write-Host "RAM: $([math]::Round($computer.TotalPhysicalMemory / 1GB, 2)) GB"
          Write-Host "Windows: $($os.Caption)"

      - name: Otimizar armazenamento
        shell: pwsh
        run: |
          Write-Host "Limpando arquivos temporarios..."

          Remove-Item "$env:TEMP\*" `
            -Recurse -Force -ErrorAction SilentlyContinue

          Remove-Item "C:\Windows\Temp\*" `
            -Recurse -Force -ErrorAction SilentlyContinue

          Write-Host "Limpeza concluida."

      - name: Instalar ferramentas
        shell: pwsh
        run: |
          $tools = @(
            "Git.Git",
            "7zip.7zip",
            "Microsoft.PowerShell"
          )

          foreach ($tool in $tools) {
            Write-Host "Verificando $tool"
          }

          winget --version

      - name: Verificar CPU e memoria
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
            NumberOfLogicalProcessors

          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize,
            FreePhysicalMemory

      - name: Verificar disco
        shell: pwsh
        run: |
          Get-Volume |
            Select-Object DriveLetter,
            FileSystemLabel,
            Size,
            SizeRemaining

      - name: Finalizar diagnostico
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host " BENJA CLOUD PC PREPARADO"
          Write-Host "================================"
          Write-Host "Ambiente Windows configurado."
          Write-Host "Fim da verificacao."
          
