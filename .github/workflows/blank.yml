
name: Benja Cloud PC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloud-pc:
    name: Preparar Windows Cloud BR
    runs-on: windows-2022
    timeout-minutes: 350

    steps:
      - name: Preparar ambiente
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "       BENJA CLOUD PC"
          Write-Host "================================"

          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor
          $os = Get-CimInstance Win32_OperatingSystem

          Write-Host "Computador: $($computer.Name)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Nucleos: $($cpu.NumberOfCores)"
          Write-Host "RAM: $([math]::Round($computer.TotalPhysicalMemory / 1GB, 2)) GB"
          Write-Host "Windows: $($os.Caption)"

      - name: Configurar Portugues Brasil
        shell: pwsh
        run: |
          Write-Host "Configurando idioma brasileiro..."

          try {
            if (Get-Command Install-Language -ErrorAction SilentlyContinue) {
              Install-Language pt-BR -CopyToSettings
            }
            else {
              Write-Host "Install-Language indisponivel."
              Write-Host "Tentando instalar recursos de idioma..."

              Add-WindowsCapability -Online `
                -Name "Language.Basic~~~pt-BR~0.0.1.0" `
                -ErrorAction Stop
            }
          }
          catch {
            Write-Warning "Nao foi possivel instalar o pacote completo: $_"
          }

          Set-WinSystemLocale pt-BR
          Set-Culture pt-BR
          Set-WinUILanguageOverride pt-BR

          $languageList = New-WinUserLanguageList pt-BR
          $languageList[0].InputMethodTips.Clear()
          $languageList[0].InputMethodTips.Add("0416:00010416")

          Set-WinUserLanguageList $languageList -Force

          Set-WinHomeLocation -GeoId 32

          Write-Host "Configuracao regional aplicada."

          Get-WinUserLanguageList

      - name: Configurar fuso horario
        shell: pwsh
        run: |
          Set-TimeZone -Id "E. South America Standard Time"

          Write-Host "Fuso horario configurado:"
          Get-TimeZone

      - name: Verificar ferramentas
        shell: pwsh
        run: |
          $tools = @("git", "7z", "pwsh")

          foreach ($tool in $tools) {
            $found = Get-Command $tool `
              -ErrorAction SilentlyContinue

            if ($found) {
              Write-Host "$tool encontrado."
            } else {
              Write-Host "$tool nao encontrado."
            }
          }

      - name: Verificar CPU e memoria
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores,
            NumberOfLogicalProcessors

          Get-CimInstance Win32_OperatingSystem |
            Select-Object TotalVisibleMemorySize,
            FreePhysicalMemory

      - name: Verificar disco
        shell: pwsh
        run: |
          Get-Volume |
            Select-Object DriveLetter,
            FileSystemLabel,
            Size,
            SizeRemaining

      - name: Diagnostico de rede
        shell: pwsh
        run: |
          Get-NetAdapter |
            Select-Object Name, Status, LinkSpeed

      - name: Finalizar diagnostico
        shell: pwsh
        run: |
          Write-Host "================================"
          Write-Host "      BENJA CLOUD PC BR"
          Write-Host "================================"

          Write-Host "Idioma solicitado: Portugues Brasil"
          Write-Host "Regiao: Brasil"
          Write-Host "Fuso: Brasilia"
          Write-Host "Preparacao concluida."
          
